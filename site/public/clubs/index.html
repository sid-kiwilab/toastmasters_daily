<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Club - Toastmasters Daily</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png"/>
  
  <link rel="preload" href="../assets/GoogleSans.woff2" as="font" type="font/woff2" crossorigin="anonymous">
  <link rel="stylesheet" href="../js/guest-entry.css">
  
  <style>
    @font-face {
      font-family: 'GoogleSans';
      src: url('../assets/GoogleSans.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: block;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'GoogleSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #ffffff;
      color: #1a1f3a;
      opacity: 0;
      transition: opacity 0.5s ease-out;
    }
    
    body.loaded {
      opacity: 1;
    }
    
    .header {
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    
    .logo img {
      height: 32px;
      width: auto;
    }
    
    .logo-text {
      font-size: 24px;
      font-weight: 600;
      color: #1a1f3a;
    }
    
    /* Hero Section - Compact & Seamless */
    .hero {
      padding: 40px 32px 0;
      position: relative;
      background: #ffffff;
    }
    
    .hero-todays-meeting {
      max-width: 1200px;
      margin: 0 auto 40px;
    }
    
    .hero-todays-meeting-section-title {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }
    
    .hero-todays-meeting-card {
      background: linear-gradient(135deg, #004165 0%, #003049 100%);
      border-radius: 20px;
      padding: 28px 32px;
      color: white;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 8px 24px rgba(0, 65, 101, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    
    .hero-todays-meeting-card:hover,
    .hero-todays-meeting-card:focus {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0, 65, 101, 0.25);
      outline: none;
    }
    
    .hero-todays-meeting-card:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.5);
      outline-offset: 2px;
    }
    
    .hero-todays-meeting-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      transform: translate(30%, -30%);
    }
    
    .hero-todays-meeting-content {
      flex: 1;
      position: relative;
      z-index: 1;
    }
    
    .hero-todays-meeting-date {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.9;
      margin-bottom: 8px;
    }
    
    .hero-todays-meeting-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    
    .hero-todays-meeting-time {
      font-size: 15px;
      opacity: 0.9;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .hero-todays-meeting-time svg {
      width: 18px;
      height: 18px;
    }
    
    .hero-todays-meeting-join {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      transition: background 0.3s ease;
      white-space: nowrap;
    }
    
    .hero-todays-meeting-card:hover .hero-todays-meeting-join {
      background: rgba(255, 255, 255, 0.3);
    }
    
    .hero-todays-meeting-join svg {
      width: 20px;
      height: 20px;
    }
    
    .hero-container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }
    
    .hero-content {
      position: relative;
      z-index: 1;
    }
    
    .club-name {
      font-size: 56px;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -2px;
      line-height: 1.1;
      margin-bottom: 16px;
    }
    
    .club-location {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 18px;
      color: #64748b;
      font-weight: 400;
      margin-bottom: 0;
      line-height: 1.6;
    }
    
    .club-location svg {
      width: 20px;
      height: 20px;
      color: #94a3b8;
      flex-shrink: 0;
      margin-top: 2px;
    }
    
    .hero-visual {
      position: relative;
      height: 400px;
      border-radius: 20px;
      overflow: hidden;
    }
    
    .hero-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    
    /* Main Content Sections */
    .main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 32px 100px;
    }
    
    .section-title {
      font-size: 36px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 32px;
      letter-spacing: -1px;
    }
    
    /* Featured Today's Meeting */
    .todays-meeting-card {
      background: linear-gradient(135deg, #004165 0%, #003049 100%);
      border-radius: 20px;
      padding: 32px;
      color: white;
      position: relative;
      overflow: hidden;
      margin-bottom: 40px;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 8px 24px rgba(0, 65, 101, 0.15);
    }
    
    .todays-meeting-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0, 65, 101, 0.25);
    }
    
    .todays-meeting-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      transform: translate(30%, -30%);
    }
    
    .todays-meeting-card::after {
      content: '';
      position: absolute;
      bottom: -20px;
      right: 20px;
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
    }
    
    .todays-meeting-date {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.9;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
    }
    
    .todays-meeting-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.3;
      position: relative;
      z-index: 1;
    }
    
    .todays-meeting-time {
      font-size: 15px;
      opacity: 0.9;
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
      z-index: 1;
    }
    
    .todays-meeting-time svg {
      width: 18px;
      height: 18px;
    }
    
    /* Other Meetings Section */
    .other-meetings-section {
      margin-top: 24px;
    }
    
    .other-meetings-title {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }
    
    /* Meetings List */
    .meetings-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .meeting-card {
      background: #ffffff;
      border: none;
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.3s ease;
      position: relative;
      cursor: default;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      opacity: 0.7;
    }
    
    .meeting-card.clickable {
      cursor: pointer;
      opacity: 1;
    }
    
    .meeting-card.clickable:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }
    
    .meeting-content-wrapper {
      padding: 24px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }
    
    .meeting-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, #f0f4f8 0%, #e5e7eb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }
    
    .meeting-card.clickable:hover .meeting-icon {
      background: linear-gradient(135deg, #004165 0%, #003049 100%);
      transform: scale(1.05);
    }
    
    .meeting-icon svg {
      width: 28px;
      height: 28px;
      color: #004165;
      transition: color 0.3s ease;
    }
    
    .meeting-card.clickable:hover .meeting-icon svg {
      color: white;
    }
    
    .meeting-content {
      flex: 1;
      min-width: 0;
    }
    
    .meeting-title {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
      letter-spacing: -0.4px;
      line-height: 1.3;
    }
    
    .meeting-datetime {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    
    .datetime-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: linear-gradient(135deg, #f8fafc 0%, #f0f4f8 100%);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #475569;
      transition: all 0.3s ease;
    }
    
    .meeting-card.clickable:hover .datetime-item {
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
      color: #004165;
    }
    
    .datetime-item svg {
      width: 16px;
      height: 16px;
      color: #64748b;
      transition: color 0.3s ease;
    }
    
    .meeting-card.clickable:hover .datetime-item svg {
      color: #004165;
    }
    
    /* About Section */
    .about-section {
      margin-top: 80px;
    }
    
    .about-content {
      background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
      border: none;
      border-radius: 20px;
      padding: 48px;
      font-size: 17px;
      line-height: 1.7;
      color: #64748b;
      white-space: pre-wrap;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }
    
    .no-meetings {
      text-align: center;
      padding: 80px 24px;
      background: linear-gradient(135deg, #fafafa 0%, #f0f4f8 100%);
      border: none;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    
    .no-meetings-text {
      color: #64748b;
      font-size: 17px;
      font-weight: 400;
    }
    
    @media (max-width: 968px) {
      .hero-container {
        grid-template-columns: 1fr;
        gap: 40px;
      }
      
      .hero-visual {
        height: 300px;
        order: -1;
      }
      
      .club-name {
        font-size: 48px;
        text-align: center;
      }
      
      .club-location {
        justify-content: center;
      }
    }
    
    @media (max-width: 768px) {
      .hero {
        padding: 32px 24px 0;
      }
      
      .hero-todays-meeting {
        margin-bottom: 32px;
      }
      
      .hero-todays-meeting-section-title {
        font-size: 24px;
        margin-bottom: 20px;
      }
      
      .hero-todays-meeting-card {
        flex-direction: column;
        align-items: flex-start;
        padding: 24px;
        gap: 16px;
      }
      
      .hero-todays-meeting-title {
        font-size: 20px;
      }
      
      .hero-todays-meeting-join {
        width: 100%;
        justify-content: center;
      }
      
      .hero-container {
        gap: 32px;
      }
      
      .hero-visual {
        height: 250px;
      }
      
      .club-name {
        font-size: 40px;
        letter-spacing: -1.5px;
      }
      
      .club-location {
        font-size: 16px;
      }
      
      .main-content {
        padding: 48px 24px 80px;
      }
      
      .section-title {
        font-size: 32px;
        letter-spacing: -1px;
      }
      
      .todays-meeting-card {
        padding: 24px;
      }
      
      .meeting-content-wrapper {
        padding: 20px;
        flex-direction: column;
        gap: 16px;
      }
      
      .meeting-title {
        font-size: 19px;
      }
      
      .about-content {
        padding: 32px;
        font-size: 16px;
      }
    }
    
    .loading-container {
      min-height: 70vh;
      padding: 100px 32px;
    }
    
    .shimmer {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }
    
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    
    .shimmer-hero-title {
      width: 400px;
      height: 80px;
      margin: 0 auto 24px;
      max-width: 100%;
    }
    
    .shimmer-hero-location {
      width: 300px;
      height: 24px;
      margin: 0 auto;
      max-width: 100%;
    }
    
    .shimmer-meeting-card {
      width: 100%;
      height: 120px;
      margin-bottom: 16px;
    }
    
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
      text-align: center;
      padding: 100px 32px;
    }
    
    .error-title {
      font-size: 36px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 16px;
      letter-spacing: -1px;
    }
    
    .error-message {
      font-size: 17px;
      color: #64748b;
      margin-bottom: 32px;
      font-weight: 400;
    }
    
    .back-button {
      padding: 14px 28px;
      background: #004165;
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background 0.2s ease;
    }
    
    .back-button:hover {
      background: #003049;
    }
    
    /* Welcome Screen Styles */
    .welcome-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      background: #ffffff;
      font-family: 'GoogleSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    }
    
    .welcome-content {
      max-width: 500px;
      width: 100%;
      text-align: center;
      font-family: 'GoogleSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    }
    
    .welcome-logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 40px;
    }
    
    .welcome-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .welcome-title {
      font-size: 42px;
      font-weight: 700;
      color: #212121;
      letter-spacing: -1px;
      line-height: 1.2;
      margin-bottom: 8px;
      font-family: 'GoogleSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    }
    
    .welcome-subtitle {
      font-size: 28px;
      font-weight: 500;
      color: #424242;
      letter-spacing: -0.5px;
      line-height: 1.3;
      margin-bottom: 48px;
      min-height: 40px;
      font-family: 'GoogleSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    }
    
    .welcome-subtitle.shimmer {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
      width: 200px;
      margin: 0 auto 48px;
    }
    
    .welcome-decorative-line {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 48px;
    }
    
    .welcome-line-segment {
      height: 3px;
      border-radius: 2px;
    }
    
    .welcome-line-gradient {
      width: 40px;
      background: linear-gradient(90deg, #C41E3A, #003366);
    }
    
    .welcome-line-gray {
      width: 60px;
      background: #E0E0E0;
    }
    
    .welcome-question {
      font-size: 18px;
      font-weight: 500;
      color: #757575;
      letter-spacing: 0.3px;
      margin-bottom: 40px;
      font-family: 'GoogleSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    }
    
    .welcome-buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 320px;
      margin: 0 auto;
    }
    
    .welcome-btn {
      width: 100%;
      height: 60px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'GoogleSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    }
    
    .welcome-btn-member {
      background: #C41E3A;
      color: #ffffff;
    }
    
    .welcome-btn-member:hover {
      background: #A01A2E;
    }
    
    .welcome-btn-guest {
      background: transparent;
      color: #424242;
      border: 2px solid #E0E0E0;
    }
    
    .welcome-btn-guest:hover {
      border-color: #BDBDBD;
      background: #FAFAFA;
    }
    
    @media (max-width: 600px) {
      .welcome-title {
        font-size: 36px;
      }
      
      .welcome-subtitle {
        font-size: 24px;
      }
      
      .welcome-logo {
        width: 100px;
        height: 100px;
        margin-bottom: 40px;
      }
      
      .welcome-buttons {
        max-width: 80%;
      }
      
      .welcome-btn {
        height: 56px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="/" class="logo">
      <img src="../assets/logo.png" alt="Toastmasters Daily">
      <span class="logo-text">Toastmasters Daily</span>
    </a>
  </header>
  
  <main>
    <!-- Welcome Screen -->
    <div id="welcome-screen" style="display: none;">
      <div class="welcome-screen">
        <div class="welcome-content">
          <div class="welcome-logo">
            <img src="../assets/logo.png" alt="Toastmasters Daily">
          </div>
          <h1 class="welcome-title">Welcome</h1>
          <div class="welcome-subtitle" id="welcome-subtitle">
            <span class="shimmer" style="display: inline-block; width: 200px; height: 28px;"></span>
          </div>
          <div class="welcome-decorative-line">
            <div class="welcome-line-segment welcome-line-gradient"></div>
            <div class="welcome-line-segment welcome-line-gray"></div>
            <div class="welcome-line-segment welcome-line-gradient" style="background: linear-gradient(90deg, #003366, #C41E3A);"></div>
          </div>
          <p class="welcome-question">Are you a member or guest?</p>
          <div class="welcome-buttons">
            <button class="welcome-btn welcome-btn-member" onclick="handleWelcomeMember()">Member</button>
            <button class="welcome-btn welcome-btn-guest" onclick="handleWelcomeGuest()">Guest</button>
          </div>
        </div>
      </div>
    </div>
    
    <div id="loading-state" class="loading-container">
      <section class="hero">
        <div class="hero-container">
          <div class="hero-content">
            <div class="shimmer shimmer-hero-title" style="width: 300px; height: 60px; margin-bottom: 16px;"></div>
            <div class="shimmer shimmer-hero-location" style="width: 200px; height: 24px;"></div>
          </div>
          <div class="hero-visual">
            <div class="shimmer" style="width: 100%; height: 100%; border-radius: 20px;"></div>
          </div>
        </div>
      </section>
      <div class="main-content">
        <div class="shimmer shimmer-meeting-card"></div>
        <div class="shimmer shimmer-meeting-card"></div>
      </div>
    </div>
    
    <div id="error-state" class="error-container" style="display: none;">
      <div class="error-title">Oops! Nothing lives here...</div>
      <div class="error-message" id="error-message">Club not found</div>
      <a href="/" class="back-button">Back to Home</a>
    </div>
    
    <div id="club-content" style="display: none;">
      <!-- Hero Section -->
      <section class="hero">
        <!-- Today's Meeting in Hero -->
        <div id="hero-todays-meeting" class="hero-todays-meeting" style="display: none;"></div>
        
        <div class="hero-container">
          <div class="hero-content">
            <h1 class="club-name" id="club-name"></h1>
            <div class="club-location" id="club-location" style="display: none;">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <span id="club-location-text"></span>
            </div>
          </div>
          <div class="hero-visual">
            <img src="../assets/join_meeting_classic.webp" alt="Join Meeting">
          </div>
        </div>
      </section>
      
      <!-- Main Content -->
      <div class="main-content">
        <!-- Today's Meeting Section -->
        <div id="todays-meeting-section" style="display: none;">
          <h2 class="section-title">Today's Meeting</h2>
          <div id="todays-meeting-card"></div>
        </div>
        
        <!-- Other Meetings Section -->
        <div id="other-meetings-section" class="other-meetings-section" style="display: none;">
          <h3 class="other-meetings-title">Upcoming Meetings</h3>
          <div class="meetings-list" id="other-meetings-list"></div>
        </div>
        
        <!-- No Meetings -->
        <div id="no-meetings" class="no-meetings" style="display: none;">
          <div class="no-meetings-text">No upcoming meetings scheduled</div>
        </div>
        
        <!-- About Section -->
        <div id="about-section" class="about-section" style="display: none;">
          <h2 class="section-title">About</h2>
          <div id="about-content" class="about-content"></div>
        </div>
      </div>
    </div>
    
    <!-- Guest Entry Dialog (Modular Component) -->
    <div id="guest-entry-container"></div>
  </main>
  
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth-utils.js"></script>
  <script src="../js/guest-entry.js"></script>
  <script src="../js/club-timezone.js"></script>
  
  <script>
    // Extract club code from URL pathname
    function getClubCodeFromUrl() {
      const pathname = window.location.pathname;
      // Extract club code from /clubs/{club_code}
      const match = pathname.match(/\/clubs\/([^\/]+)/);
      return match ? match[1] : null;
    }
    
    // Initialize Firebase
    let clubDb = null;
    
    function showError(message) {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('error-state').style.display = 'flex';
      document.getElementById('error-message').textContent = message;
    }
    
    function showClubContent() {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('welcome-screen').style.display = 'none';
      document.getElementById('club-content').style.display = 'block';
      // Show header when showing club content
      document.querySelector('.header').style.display = 'flex';
    }
    
    function showWelcomeScreen() {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('club-content').style.display = 'none';
      document.getElementById('welcome-screen').style.display = 'block';
      // Hide header when showing welcome screen
      document.querySelector('.header').style.display = 'none';
    }
    
    // Check if welcome should be shown (synchronously before loading)
    function shouldShowWelcome(clubCode) {
      if (!clubCode) return false;
      const welcomeKey = `club_welcome_shown_${clubCode}`;
      return sessionStorage.getItem(welcomeKey) !== 'true';
    }
    
    // Mark welcome as shown
    function markWelcomeShown(clubCode) {
      if (!clubCode) return;
      const welcomeKey = `club_welcome_shown_${clubCode}`;
      sessionStorage.setItem(welcomeKey, 'true');
    }
    
    // Handle welcome continue (member or guest)
    function handleWelcomeMember() {
      const clubCode = getClubCodeFromUrl();
      markWelcomeShown(clubCode);
      showClubContent();
    }
    
    async function handleWelcomeGuest() {
      const clubCode = getClubCodeFromUrl();
      markWelcomeShown(clubCode);
      
      // Ensure guest entry HTML is loaded
      const container = document.getElementById('guest-entry-container');
      if (container && !container.innerHTML.trim()) {
        await loadGuestEntryHTML();
      }
      
      // Hide welcome screen and show guest entry dialog
      document.getElementById('welcome-screen').style.display = 'none';
      
      // Check if GuestEntry is available and initialized
      if (typeof GuestEntry !== 'undefined' && clubDb) {
        // Ensure GuestEntry is initialized with current creatorId
        if (window.creatorId) {
          GuestEntry.init(clubDb, window.creatorId, function() {
            showClubContent();
          });
        } else {
          GuestEntry.init(clubDb, null, function() {
            showClubContent();
          });
        }
        await GuestEntry.show();
      } else {
        // Fallback: if guest entry not ready, just show club content
        console.warn('Guest entry not ready, showing club content');
        showClubContent();
      }
    }
    
    let clubNameForWelcome = null;
    let shouldShowWelcomeScreen = false;
    let clubTimezone = null;
    
    async function loadClubData() {
      const clubCode = getClubCodeFromUrl();
      
      if (!clubCode) {
        showError('Invalid club code');
        return;
      }
      
      // Check if welcome should be shown (synchronously)
      shouldShowWelcomeScreen = shouldShowWelcome(clubCode);
      
      if (!clubDb) {
        showError('Database not initialized');
        return;
      }
      
      try {
        // Query club_codes collection
        const clubCodeDoc = await clubDb.collection('club_codes').doc(clubCode).get();
        
        if (!clubCodeDoc.exists) {
          showError('Club not found');
          return;
        }
        
        const uid = clubCodeDoc.data()?.uid;
        if (!uid) {
          showError('Invalid club data');
          return;
        }
        
        // Set creatorId globally for guest entry
        window.creatorId = uid;
        
        // Update guest entry widget with creatorId
        GuestEntry.init(clubDb, uid, function() {
          // On success callback - show club content after guest entry
          showClubContent();
        });
        
        // Query users collection
        const userDoc = await clubDb.collection('users').doc(uid).get();
        
        if (!userDoc.exists) {
          showError('Club owner information not available');
          return;
        }
        
        const userData = userDoc.data();
        clubTimezone = userData?.club_timezone || null;
        const clubName = userData?.club_name || 'Unnamed Club';
        document.getElementById('club-name').textContent = clubName;
        
        // Update welcome screen subtitle if welcome screen is showing
        if (shouldShowWelcomeScreen) {
          const welcomeSubtitle = document.getElementById('welcome-subtitle');
          if (welcomeSubtitle) {
            welcomeSubtitle.innerHTML = `to ${escapeHtml(clubName)}`;
            welcomeSubtitle.classList.remove('shimmer');
          }
        }
        
        if (userData?.club_location) {
          document.getElementById('club-location').style.display = 'flex';
          document.getElementById('club-location-text').textContent = userData.club_location;
        }
        
        if (userData?.club_info) {
          document.getElementById('about-section').style.display = 'block';
          document.getElementById('about-content').textContent = userData.club_info;
        }
        
        // Show welcome screen if needed, otherwise show club content
        // Note: If welcome screen was already shown in init(), it stays visible
        // Otherwise show club content
        if (!shouldShowWelcomeScreen) {
          showClubContent();
        }
        // If shouldShowWelcomeScreen is true, welcome screen is already showing from init()
        
        // Load meetings
        await loadMeetings(uid);
      } catch (error) {
        console.error('Error loading club data:', error);
        showError('Error loading club: ' + error.message);
      }
    }
    
    function formatMeetingDisplay(date) {
      if (window.ClubTimezone) {
        return ClubTimezone.formatMeetingInTimezone(date, clubTimezone);
      }
      const d = new Date(date);
      return {
        dateStr: d.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }),
        timeStr: d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }),
        tzAbbr: '',
        dayName: d.toLocaleDateString('en-US', { weekday: 'long' }),
      };
    }

    function formatDate(date) {
      return formatMeetingDisplay(date).dateStr;
    }

    function formatTime(date) {
      const f = formatMeetingDisplay(date);
      return f.timeStr + (f.tzAbbr ? ' ' + f.tzAbbr : '');
    }
    
    // Load meetings
    async function loadMeetings(userId) {
      if (!clubDb) return;
      
      try {
        const now = new Date();
        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const todayStartUTC = new Date(todayStart.toISOString());
        
        // Query meetings from today onwards, limit to 3
        let meetingsSnapshot;
        try {
          meetingsSnapshot = await clubDb
            .collection('users')
            .doc(userId)
            .collection('meetings')
            .where('meeting_datetime', '>=', firebase.firestore.Timestamp.fromDate(todayStartUTC))
            .orderBy('meeting_datetime', 'asc')
            .limit(3)
            .get();
        } catch (indexError) {
          // If index doesn't exist, try without orderBy
          try {
            meetingsSnapshot = await clubDb
              .collection('users')
              .doc(userId)
              .collection('meetings')
              .where('meeting_datetime', '>=', firebase.firestore.Timestamp.fromDate(todayStartUTC))
              .limit(10)
              .get();
          } catch (queryError) {
            // If even that fails, get all and filter client-side
            meetingsSnapshot = await clubDb
              .collection('users')
              .doc(userId)
              .collection('meetings')
              .limit(10)
              .get();
          }
        }
        
        const allMeetings = [];
        meetingsSnapshot.forEach(doc => {
          const data = doc.data();
          allMeetings.push({
            id: doc.id,
            ...data
          });
        });
        
        // Filter to only future meetings and sort
        const futureMeetings = allMeetings
          .filter(meeting => {
            const meetingDate = meeting.meeting_datetime?.toDate();
            if (!meetingDate) return false;
            return meetingDate >= todayStart;
          })
          .sort((a, b) => {
            const dateA = a.meeting_datetime?.toDate() || new Date(0);
            const dateB = b.meeting_datetime?.toDate() || new Date(0);
            return dateA - dateB;
          });
        
        // Separate today's meeting from others
        const todayEnd = new Date(todayStart);
        todayEnd.setHours(23, 59, 59, 999);
        
        const todaysMeeting = futureMeetings.find(meeting => {
          const meetingDate = meeting.meeting_datetime?.toDate();
          if (!meetingDate) return false;
          return meetingDate >= todayStart && meetingDate <= todayEnd;
        });
        
        const otherMeetings = futureMeetings.filter(meeting => {
          if (todaysMeeting && meeting.id === todaysMeeting.id) return false;
          return true;
        }).slice(0, 2); // Limit to 2 other meetings
        
        // Render meetings
        const heroTodaysMeeting = document.getElementById('hero-todays-meeting');
        const todaysMeetingSection = document.getElementById('todays-meeting-section');
        const todaysMeetingCard = document.getElementById('todays-meeting-card');
        const todaysMeetingTitle = todaysMeetingSection.querySelector('.section-title');
        const otherMeetingsSection = document.getElementById('other-meetings-section');
        const otherMeetingsList = document.getElementById('other-meetings-list');
        const noMeetings = document.getElementById('no-meetings');
        
        if (todaysMeeting || otherMeetings.length > 0) {
          noMeetings.style.display = 'none';
          
          // Render today's meeting in hero section
          if (todaysMeeting) {
            const meetingDate = todaysMeeting.meeting_datetime?.toDate();
            if (meetingDate) {
              const formatted = formatMeetingDisplay(meetingDate);
              const dateStr = formatted.dateStr;
              const timeStr = formatTime(meetingDate);
              const dayName = formatted.dayName;
              
              // Render in hero section
              if (heroTodaysMeeting) {
                heroTodaysMeeting.style.display = 'block';
                // Firestore document IDs are URL-safe, so we can use them directly in URLs
                const meetingId = todaysMeeting.id;
                const meetingTitle = escapeHtml(todaysMeeting.title || 'Untitled Meeting');
                heroTodaysMeeting.innerHTML = `
                  <h3 class="hero-todays-meeting-section-title">Today's Meeting</h3>
                  <div class="hero-todays-meeting-card" data-meeting-id="${escapeHtml(meetingId)}" role="button" tabindex="0" aria-label="Join today's meeting: ${meetingTitle}">
                    <div class="hero-todays-meeting-content">
                      <div class="hero-todays-meeting-date">${dayName}, ${dateStr}</div>
                      <div class="hero-todays-meeting-title">${meetingTitle}</div>
                      ${timeStr ? `
                        <div class="hero-todays-meeting-time">
                          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                          </svg>
                          ${timeStr}
                        </div>
                      ` : ''}
                    </div>
                    <div class="hero-todays-meeting-join">
                      <span>Join Meeting</span>
                      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                      </svg>
                    </div>
                  </div>
                `;
                
                // Add event listener for click and keyboard navigation
                const card = heroTodaysMeeting.querySelector('.hero-todays-meeting-card');
                if (card) {
                  const handleMeetingClick = () => {
                    window.location.href = `/meetings/${meetingId}`;
                  };
                  card.addEventListener('click', handleMeetingClick);
                  card.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                      e.preventDefault();
                      handleMeetingClick();
                    }
                  });
                }
              }
              
              // Hide main content section's today's meeting since it's shown in hero
              if (todaysMeetingSection) {
                todaysMeetingSection.style.display = 'none';
              }
            }
            
            // Render other meetings below today's meeting
            if (otherMeetings.length > 0) {
              otherMeetingsSection.style.display = 'block';
              otherMeetingsList.innerHTML = otherMeetings.map(meeting => {
              const meetingDate = meeting.meeting_datetime?.toDate();
              if (!meetingDate) return '';
              
              const dateStr = formatDate(meetingDate);
              const timeStr = formatTime(meetingDate);
              
              return `
                <div class="meeting-card">
                  <div class="meeting-content-wrapper">
                    <div class="meeting-icon">
                      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                      </svg>
                    </div>
                    <div class="meeting-content">
                      <div class="meeting-title">${escapeHtml(meeting.title || 'Untitled Meeting')}</div>
                      <div class="meeting-datetime">
                        <div class="datetime-item">
                          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                          </svg>
                          ${dateStr}
                        </div>
                        ${timeStr ? `
                          <div class="datetime-item">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            ${timeStr}
                          </div>
                        ` : ''}
                      </div>
                    </div>
                  </div>
                </div>
              `;
              }).join('');
            } else {
              otherMeetingsSection.style.display = 'none';
            }
          } else {
            // Hide hero today's meeting section if no meeting today
            if (heroTodaysMeeting) {
              heroTodaysMeeting.style.display = 'none';
            }
            
            // If no today's meeting but there are upcoming meetings, show them in the main section
            if (otherMeetings.length > 0) {
              todaysMeetingSection.style.display = 'block';
              if (todaysMeetingTitle) {
                todaysMeetingTitle.textContent = "Upcoming Meetings";
              }
              todaysMeetingCard.innerHTML = '';
              otherMeetingsSection.style.display = 'none';
              
              // Show upcoming meetings in the main section
              const upcomingMeetingsList = document.createElement('div');
              upcomingMeetingsList.className = 'meetings-list';
              upcomingMeetingsList.innerHTML = otherMeetings.map(meeting => {
                const meetingDate = meeting.meeting_datetime?.toDate();
                if (!meetingDate) return '';
                
                const dateStr = formatDate(meetingDate);
                const timeStr = formatTime(meetingDate);
                
                return `
                  <div class="meeting-card">
                    <div class="meeting-content-wrapper">
                      <div class="meeting-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                      </div>
                      <div class="meeting-content">
                        <div class="meeting-title">${escapeHtml(meeting.title || 'Untitled Meeting')}</div>
                        <div class="meeting-datetime">
                          <div class="datetime-item">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                            ${dateStr}
                          </div>
                          ${timeStr ? `
                            <div class="datetime-item">
                              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                              </svg>
                              ${timeStr}
                            </div>
                          ` : ''}
                        </div>
                      </div>
                    </div>
                  </div>
                `;
              }).join('');
              
              // Clear existing content and add the list
              todaysMeetingCard.innerHTML = '';
              todaysMeetingCard.appendChild(upcomingMeetingsList);
            } else {
              if (heroTodaysMeeting) heroTodaysMeeting.style.display = 'none';
              if (todaysMeetingSection) todaysMeetingSection.style.display = 'none';
              if (otherMeetingsSection) otherMeetingsSection.style.display = 'none';
            }
          }
        } else {
          if (heroTodaysMeeting) heroTodaysMeeting.style.display = 'none';
          if (todaysMeetingSection) todaysMeetingSection.style.display = 'none';
          if (otherMeetingsSection) otherMeetingsSection.style.display = 'none';
          if (noMeetings) noMeetings.style.display = 'block';
        }
      } catch (error) {
        console.error('Error loading meetings:', error);
        // Don't show error for meetings, just hide the section
        document.getElementById('upcoming-meetings-section').style.display = 'none';
      }
    }
    
    // Escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    // Close guest entry and show club content (for clubs page)
    function closeGuestEntryAndShowClub() {
      GuestEntry.close();
      showClubContent();
    }
    
    // Load guest entry HTML snippet
    async function loadGuestEntryHTML() {
      try {
        const response = await fetch('../js/guest-entry.html');
        const html = await response.text();
        const container = document.getElementById('guest-entry-container');
        if (container) {
          container.innerHTML = html;
          
          // Replace close button handlers to show club content when closed
          const closeButtons = container.querySelectorAll('[onclick*="GuestEntry.close()"]');
          closeButtons.forEach(btn => {
            btn.setAttribute('onclick', 'closeGuestEntryAndShowClub()');
          });
        }
      } catch (error) {
        console.error('Error loading guest entry HTML:', error);
      }
    }
    
    // Initialize
    function init() {
      try {
        const clubCode = getClubCodeFromUrl();
        
        // Check if welcome should be shown synchronously before loading
        // This prevents flash of club content
        if (clubCode && shouldShowWelcome(clubCode)) {
          showWelcomeScreen();
        }
        
        initClubAuth();
        const clubApp = firebase.app('club');
        clubDb = firebase.firestore(clubApp);
        
        // Load guest entry HTML in background (don't block initialization)
        loadGuestEntryHTML().then(() => {
          // Initialize guest entry widget after HTML is loaded (creatorId will be set in loadClubData)
          if (typeof GuestEntry !== 'undefined' && clubDb) {
            GuestEntry.init(clubDb, null, function() {
              // On success callback - show club content after guest entry
              showClubContent();
            });
          }
        }).catch(err => {
          console.error('Failed to load guest entry HTML:', err);
        });
        
        loadClubData();
      } catch (error) {
        console.error('Error initializing:', error);
        showError('Error initializing: ' + error.message);
      }
    }
    
    // Wait for scripts to load
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      setTimeout(init, 100);
    }
    
    // Wait for fonts to be ready before showing page content
    document.addEventListener('DOMContentLoaded', () => {
      document.fonts.ready.then(() => {
        document.body.classList.add('loaded');
      });
    });
  </script>
</body>
</html>
