name: toastmasters_daily
description: "Toastmasters Daily App"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.4.0
  cloud_functions: ^5.3.3
  firebase_storage: ^12.3.0
  file_picker: ^8.0.0+1
  url_launcher: ^6.2.5
  http: ^0.13.6
  pdf_render: ^1.4.12
  internet_file: ^1.2.0
  device_info_plus: ^10.1.0
  crypto: ^3.0.3
  qr_flutter: ^4.1.0
  pdf: ^3.10.7
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: OldschoolGrotesk
      fonts:
        - asset: assets/fonts/OldschoolGroteskVar.ttf
