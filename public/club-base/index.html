<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Base - Toastmasters Daily</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png"/>
  
  <style>
    @font-face {
      font-family: 'GoogleSans';
      src: url('../assets/GoogleSans.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'GoogleSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #ffffff;
      color: #212121;
      min-height: 100vh;
      padding: 20px;
    }
    
    .header {
      max-width: 1200px;
      margin: 0 auto 40px;
      padding: 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #E5E7EB;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    
    .logo img {
      height: 32px;
      width: auto;
    }
    
    .logo-text {
      font-size: 24px;
      font-weight: 600;
      color: #1a1f3a;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    
    .page-title {
      font-size: 48px;
      font-weight: 900;
      color: #1a1f3a;
      margin-bottom: 16px;
      letter-spacing: -1px;
    }
    
    .page-subtitle {
      font-size: 18px;
      color: #6B7280;
      margin-bottom: 40px;
    }
    
    .content-card {
      background: #F9FAFB;
      border-radius: 12px;
      padding: 40px;
      margin-bottom: 24px;
    }
    
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      font-family: 'GoogleSans', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    
    .btn-logout {
      background: #DC2626;
      color: white;
    }
    
    .btn-logout:hover {
      background: #B91C1C;
    }
    
    .user-info {
      margin-bottom: 24px;
    }
    
    .user-info p {
      font-size: 16px;
      color: #374151;
      margin-bottom: 8px;
    }
    
    .user-info strong {
      color: #1a1f3a;
    }
    
    /* Shimmer loading effect */
    .shimmer {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
      display: inline-block;
    }
    
    .shimmer-line {
      height: 20px;
      width: 200px;
      margin-bottom: 12px;
    }
    
    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }
      100% {
        background-position: 200% 0;
      }
    }
    
    .user-info.loading {
      opacity: 0;
    }
    
    .user-info.loaded {
      opacity: 1;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="/" class="logo">
      <img src="../assets/logo.png" alt="Toastmasters Daily logo">
      <span class="logo-text">Toastmasters Daily</span>
    </a>
  </div>
  
  <div class="container">
    <h1 class="page-title">Club Base</h1>
    <p class="page-subtitle">Welcome to your club dashboard</p>
    
    <div class="content-card">
      <div id="user-info-shimmer">
        <div class="shimmer shimmer-line"></div>
        <div class="shimmer shimmer-line" style="width: 150px;"></div>
      </div>
      <div class="user-info loading" id="user-info">
        <p><strong>Loading user information...</strong></p>
      </div>
      
      <button id="logout-btn" class="btn btn-logout">Logout</button>
    </div>
  </div>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth-utils.js"></script>
  
  <script>
    // Initialize Firebase
    const clubAuth = initClubAuth();
    const memberAuth = initMemberAuth();
    
    let memberAuthResolved = false;
    let clubAuthResolved = false;
    
    function checkAuthAndUpdate() {
      // Wait for both auth states to resolve
      if (!memberAuthResolved || !clubAuthResolved) {
        return;
      }
      
      // Check if member user is logged in, redirect to member base
      const memberUser = memberAuth ? memberAuth.currentUser : null;
      if (memberUser) {
        window.location.href = '../member-base/';
        return;
      }
      
      // Check if club user is logged in
      const clubUser = clubAuth ? clubAuth.currentUser : null;
      if (clubUser) {
        // Hide shimmer
        const shimmerDiv = document.getElementById('user-info-shimmer');
        if (shimmerDiv) shimmerDiv.style.display = 'none';
        
        // User is logged in, show user info
        const userInfoDiv = document.getElementById('user-info');
        if (userInfoDiv) {
          userInfoDiv.innerHTML = `
            <p><strong>Email:</strong> ${clubUser.email || 'N/A'}</p>
            <p><strong>Display Name:</strong> ${clubUser.displayName || 'N/A'}</p>
          `;
          userInfoDiv.classList.remove('loading');
          userInfoDiv.classList.add('loaded');
        }
      } else {
        // User is not logged in, redirect to login
        window.location.href = '../club-login/';
      }
    }
    
    // Check member auth state
    if (memberAuth) {
      memberAuth.onAuthStateChanged((memberUser) => {
        memberAuthResolved = true;
        checkAuthAndUpdate();
      });
    } else {
      memberAuthResolved = true;
      checkAuthAndUpdate();
    }
    
    // Check club auth state
    if (clubAuth) {
      clubAuth.onAuthStateChanged((user) => {
        clubAuthResolved = true;
        checkAuthAndUpdate();
      });
    } else {
      // Firebase not initialized, redirect to login
      window.location.href = '../club-login/';
    }
    
    // Logout handler
    const logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn && clubAuth) {
      logoutBtn.addEventListener('click', async () => {
        try {
          await logoutClub(clubAuth, '/');
          notifications.success('Successfully signed out');
        } catch (error) {
          notifications.error('Error signing out. Redirecting...');
          setTimeout(() => {
            window.location.href = '/';
          }, 1000);
        }
      });
    }
  </script>
</body>
</html>
