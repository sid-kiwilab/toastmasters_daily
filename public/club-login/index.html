<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Login - Toastmasters Daily</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png"/>
  
  <style>
    @font-face {
      font-family: 'GoogleSans';
      src: url('../assets/GoogleSans.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'GoogleSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #ffffff;
      color: #212121;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .login-container {
      width: 100%;
      max-width: 420px;
    }
    
    .close-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      background: none;
      border: none;
      font-size: 28px;
      color: #6B7280;
      cursor: pointer;
      line-height: 1;
      padding: 8px;
    }
    
    .close-btn:hover {
      color: #212121;
    }
    
    .title {
      font-size: 36px;
      font-weight: 900;
      color: #212121;
      letter-spacing: -1px;
      margin-bottom: 8px;
      line-height: 1.1;
    }
    
    .subtitle {
      font-size: 16px;
      color: #6B7280;
      margin-bottom: 40px;
      font-weight: 400;
    }
    
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }
    
    input {
      width: 100%;
      padding: 16px 20px;
      border: none;
      border-radius: 12px;
      background: #F2F1F0;
      font-size: 16px;
      font-family: 'GoogleSans', sans-serif;
      color: #212121;
    }
    
    input[type="password"] {
      padding-right: 50px;
    }
    
    .password-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #6B7280;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
    }
    
    .password-toggle:hover {
      color: #212121;
    }
    
    .password-toggle svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
    }
    
    input:focus {
      outline: none;
      background: #E8E7E6;
    }
    
    input::placeholder {
      color: #9CA3AF;
    }
    
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      font-family: 'GoogleSans', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #004165 0%, #0066A3 100%);
      color: white;
      margin-bottom: 24px;
    }
    
    .btn-primary:hover {
      background: linear-gradient(135deg, #003049 0%, #005588 100%);
    }
    
    .forgot-link {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .forgot-link a {
      color: #004165;
      text-decoration: none;
      font-size: 14px;
    }
    
    .forgot-link a:hover {
      text-decoration: underline;
    }
    
    .signup-link {
      text-align: center;
      padding: 20px;
      background: #F9FAFB;
      border-radius: 12px;
      font-size: 15px;
      color: #6B7280;
    }
    
    .signup-link a {
      color: #004165;
      text-decoration: none;
      font-weight: 600;
    }
    
    .signup-link a:hover {
      text-decoration: underline;
    }
    
    .error-message {
      display: none;
      background: #FEE2E2;
      color: #DC2626;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      border: 1px solid #FCA5A5;
    }
    
    .error-message.show {
      display: block;
    }
    
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    /* Modal/Dialog Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.2s ease-out;
    }
    
    .modal-overlay.active {
      display: flex;
    }
    
    .modal {
      background: white;
      border-radius: 16px;
      padding: 32px;
      max-width: 420px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      animation: slideUp 0.3s ease-out;
      position: relative;
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    
    .modal-title {
      font-size: 24px;
      font-weight: 700;
      color: #1a1f3a;
      margin: 0;
    }
    
    .modal-close {
      background: none;
      border: none;
      font-size: 28px;
      color: #6B7280;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
      transition: color 0.2s;
    }
    
    .modal-close:hover {
      color: #212121;
    }
    
    .modal-content {
      margin-bottom: 24px;
    }
    
    .modal-text {
      font-size: 15px;
      color: #6B7280;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    
    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }
    
    .btn-secondary {
      background: #F3F4F6;
      color: #374151;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'GoogleSans', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }
    
    .btn-secondary:hover {
      background: #E5E7EB;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    
    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <button class="close-btn" onclick="window.location.href='/'">×</button>
  
  <div class="login-container">
    <h1 class="title">Club Login</h1>
    <p class="subtitle">Sign in to manage your club meetings</p>
    
    <form id="login-form">
      <div class="form-group">
        <input type="email" id="email" placeholder="Email" required>
      </div>
      
      <div class="form-group">
        <input type="password" id="password" placeholder="Password" required>
        <button type="button" class="password-toggle" id="togglePassword">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      
      <button type="submit" class="btn btn-primary">Sign In</button>
      
      <div class="forgot-link">
        <a href="#" id="forgot-password-link">Forgot Password?</a>
      </div>
      
      <div class="signup-link">
        Don't have an account? <a href="../club-signup/">Sign Up</a>
      </div>
    </form>
  </div>
  
  <!-- Forgot Password Modal -->
  <div class="modal-overlay" id="forgot-password-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Reset Password</h2>
        <button class="modal-close" id="close-forgot-modal">×</button>
      </div>
      <div class="modal-content">
        <p class="modal-text">
          Enter your email address and we'll send you a link to reset your password.
        </p>
        <form id="forgot-password-form">
          <div class="form-group">
            <input type="email" id="reset-email" placeholder="Email" required>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" id="cancel-reset">Cancel</button>
            <button type="submit" class="btn btn-primary" id="send-reset-btn">Send Reset Link</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth-utils.js"></script>
  
  <script>
    // Get form elements (declare once, reuse everywhere)
    const loginForm = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const toggleButton = document.getElementById('togglePassword');
    const submitBtn = loginForm ? loginForm.querySelector('button[type="submit"]') : null;
    
    let isVisible = false;
    
    // Password toggle functionality
    if (toggleButton && passwordInput) {
      toggleButton.addEventListener('click', () => {
        isVisible = !isVisible;
        passwordInput.type = isVisible ? 'text' : 'password';
        const svg = toggleButton.querySelector('svg');
        if (svg) {
          if (isVisible) {
            svg.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
          } else {
            svg.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
          }
        }
      });
    }
    
    // Initialize Firebase
    const clubAuth = initClubAuth();
    const memberAuth = initMemberAuth();
    
    // Check if member user is logged in, redirect to member base
    if (memberAuth) {
      memberAuth.onAuthStateChanged((memberUser) => {
        if (memberUser) {
          window.location.href = '../member-base/';
        }
      });
    }
    
    // Check if club user is already logged in, redirect to club base
    if (clubAuth) {
      clubAuth.onAuthStateChanged((user) => {
        if (user) {
          window.location.href = '../club-base/';
        }
      });
    }
    
    // Use notification system for errors
    function showError(message) {
      notifications.error(message);
    }
    
    function hideError() {
      // Not needed with notification system, but kept for compatibility
    }
    
    if (loginForm && clubAuth) {
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError();
        
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        
        if (!email || !password) {
          showError('Please enter both email and password.');
          return;
        }
        
        try {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Signing in...';
          
          await clubAuth.signInWithEmailAndPassword(email, password);
          
          submitBtn.textContent = 'Success! Redirecting...';
          notifications.success('Successfully signed in!');
          setTimeout(() => {
            window.location.href = '../club-base/';
          }, 800);
          
        } catch (error) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
          showError(getAuthErrorMessage(error));
        }
      });
    } else if (!clubAuth) {
      showError('Authentication service is not available. Please refresh the page.');
    }
    
    // Forgot Password Modal
    const forgotPasswordLink = document.getElementById('forgot-password-link');
    const forgotPasswordModal = document.getElementById('forgot-password-modal');
    const closeForgotModal = document.getElementById('close-forgot-modal');
    const cancelReset = document.getElementById('cancel-reset');
    const forgotPasswordForm = document.getElementById('forgot-password-form');
    const resetEmailInput = document.getElementById('reset-email');
    const sendResetBtn = document.getElementById('send-reset-btn');
    
    // Open modal
    if (forgotPasswordLink) {
      forgotPasswordLink.addEventListener('click', (e) => {
        e.preventDefault();
        if (forgotPasswordModal) {
          forgotPasswordModal.classList.add('active');
          // Pre-fill email if user has entered it in login form
          if (emailInput && emailInput.value) {
            resetEmailInput.value = emailInput.value;
          }
          // Focus on email input
          setTimeout(() => {
            if (resetEmailInput) resetEmailInput.focus();
          }, 100);
        }
      });
    }
    
    // Close modal functions
    function closeForgotPasswordModal() {
      if (forgotPasswordModal) {
        forgotPasswordModal.classList.remove('active');
        if (forgotPasswordForm) forgotPasswordForm.reset();
      }
    }
    
    if (closeForgotModal) {
      closeForgotModal.addEventListener('click', closeForgotPasswordModal);
    }
    
    if (cancelReset) {
      cancelReset.addEventListener('click', closeForgotPasswordModal);
    }
    
    // Close modal when clicking overlay
    if (forgotPasswordModal) {
      forgotPasswordModal.addEventListener('click', (e) => {
        if (e.target === forgotPasswordModal) {
          closeForgotPasswordModal();
        }
      });
    }
    
    // Close modal on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && forgotPasswordModal && forgotPasswordModal.classList.contains('active')) {
        closeForgotPasswordModal();
      }
    });
    
    // Handle password reset form submission
    if (forgotPasswordForm && clubAuth) {
      const originalResetBtnText = sendResetBtn ? sendResetBtn.textContent : 'Send Reset Link';
      
      forgotPasswordForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = resetEmailInput.value.trim();
        
        if (!email) {
          notifications.error('Please enter your email address.');
          return;
        }
        
        if (!sendResetBtn) return;
        
        try {
          sendResetBtn.disabled = true;
          sendResetBtn.textContent = 'Sending...';
          
          await clubAuth.sendPasswordResetEmail(email);
          
          // Reset button state before closing
          sendResetBtn.disabled = false;
          sendResetBtn.textContent = originalResetBtnText;
          
          notifications.success('Password reset email sent! Please check your inbox.');
          closeForgotPasswordModal();
          
        } catch (error) {
          // Reset button state on error
          sendResetBtn.disabled = false;
          sendResetBtn.textContent = originalResetBtnText;
          notifications.error(getUserFriendlyErrorMessage(error));
        }
      });
    }
  </script>
</body>
</html>
