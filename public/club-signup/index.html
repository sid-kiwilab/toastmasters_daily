<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Sign Up - Toastmasters Daily</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png"/>
  
  <style>
    @font-face {
      font-family: 'GoogleSans';
      src: url('../assets/GoogleSans.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'GoogleSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #ffffff;
      color: #212121;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .signup-container {
      width: 100%;
      max-width: 420px;
    }
    
    .close-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      background: none;
      border: none;
      font-size: 28px;
      color: #6B7280;
      cursor: pointer;
      line-height: 1;
      padding: 8px;
    }
    
    .close-btn:hover {
      color: #212121;
    }
    
    .title {
      font-size: 36px;
      font-weight: 900;
      color: #212121;
      letter-spacing: -1px;
      margin-bottom: 8px;
      line-height: 1.1;
    }
    
    .subtitle {
      font-size: 16px;
      color: #6B7280;
      margin-bottom: 40px;
      font-weight: 400;
    }
    
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }
    
    input {
      width: 100%;
      padding: 16px 20px;
      border: none;
      border-radius: 12px;
      background: #F2F1F0;
      font-size: 16px;
      font-family: 'GoogleSans', sans-serif;
      color: #212121;
    }
    
    input[type="password"] {
      padding-right: 50px;
    }
    
    .password-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #6B7280;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
    }
    
    .password-toggle:hover {
      color: #212121;
    }
    
    .password-toggle svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
    }
    
    input:focus {
      outline: none;
      background: #E8E7E6;
    }
    
    input::placeholder {
      color: #9CA3AF;
    }
    
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      font-family: 'GoogleSans', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #004165 0%, #0066A3 100%);
      color: white;
      margin-bottom: 24px;
    }
    
    .btn-primary:hover {
      background: linear-gradient(135deg, #003049 0%, #005588 100%);
    }
    
    .login-link {
      text-align: center;
      padding: 20px;
      background: #F9FAFB;
      border-radius: 12px;
      font-size: 15px;
      color: #6B7280;
    }
    
    .login-link a {
      color: #004165;
      text-decoration: none;
      font-weight: 600;
    }
    
    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <button class="close-btn" onclick="window.location.href='/'">×</button>
  
  <div class="signup-container">
    <h1 class="title">Club Sign Up</h1>
    <p class="subtitle">Create an account to manage your club meetings</p>
    
    <form id="signup-form">
      <div class="form-group">
        <input type="email" id="email" placeholder="Email" required>
      </div>
      
      <div class="form-group">
        <input type="password" id="password" placeholder="Password" required>
        <button type="button" class="password-toggle" id="togglePassword">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      
      <div class="form-group">
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
        <button type="button" class="password-toggle" id="toggleConfirmPassword">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      
      <button type="submit" class="btn btn-primary">Create Account</button>
      
      <div class="login-link">
        Already have an account? <a href="../club-login/">Sign In</a>
      </div>
    </form>
  </div>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth-utils.js"></script>
  
  <script>
    // Initialize Firebase
    const clubAuth = initClubAuth();
    const memberAuth = initMemberAuth();
    
    // Check if member user is logged in, redirect to member base
    if (memberAuth) {
      memberAuth.onAuthStateChanged((memberUser) => {
        if (memberUser) {
          window.location.href = '../member-base/';
        }
      });
    }
    
    // Check if club user is already logged in, redirect to club base
    if (clubAuth) {
      clubAuth.onAuthStateChanged((user) => {
        if (user) {
          window.location.href = '../club-base/';
        }
      });
    }
    
    // Use notification system for errors
    function showError(message) {
      notifications.error(message);
    }
    
    function hideError() {
      // Not needed with notification system, but kept for compatibility
    }
    
    // Get form elements (declare once, reuse everywhere)
    const signupForm = document.getElementById('signup-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const togglePassword = document.getElementById('togglePassword');
    const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
    const submitBtn = signupForm ? signupForm.querySelector('button[type="submit"]') : null;
    
    let passwordVisible = false;
    
    // Password toggle functionality - toggles both password fields together
    function updatePasswordVisibility(isVisible) {
      // Update both password fields
      if (passwordInput) {
        passwordInput.type = isVisible ? 'text' : 'password';
      }
      if (confirmPasswordInput) {
        confirmPasswordInput.type = isVisible ? 'text' : 'password';
      }
      
      // Update both toggle icons
      const passwordSvg = togglePassword ? togglePassword.querySelector('svg') : null;
      const confirmSvg = toggleConfirmPassword ? toggleConfirmPassword.querySelector('svg') : null;
      
      const svgContent = isVisible 
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      
      if (passwordSvg) {
        passwordSvg.innerHTML = svgContent;
      }
      if (confirmSvg) {
        confirmSvg.innerHTML = svgContent;
      }
    }
    
    // Both toggle buttons toggle both password fields
    if (togglePassword) {
      togglePassword.addEventListener('click', () => {
        passwordVisible = !passwordVisible;
        updatePasswordVisibility(passwordVisible);
      });
    }
    
    if (toggleConfirmPassword) {
      toggleConfirmPassword.addEventListener('click', () => {
        passwordVisible = !passwordVisible;
        updatePasswordVisibility(passwordVisible);
      });
    }
    
    if (signupForm && clubAuth) {
      signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError();
        
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        
        // Validation
        if (!email || !password || !confirmPassword) {
          showError('Please fill in all fields.');
          return;
        }
        
        if (password !== confirmPassword) {
          showError('Passwords do not match.');
          return;
        }
        
        if (password.length < 6) {
          showError('Password must be at least 6 characters long.');
          return;
        }
        
        try {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Creating account...';
          
          const userCredential = await clubAuth.createUserWithEmailAndPassword(email, password);
          
          // Send verification email
          if (userCredential.user) {
            await userCredential.user.sendEmailVerification();
          }
          
          submitBtn.textContent = 'Success! Redirecting...';
          notifications.success('Account created! Please check your email to verify your account.');
          setTimeout(() => {
            window.location.href = '../club-base/';
          }, 1500);
          
        } catch (error) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
          showError(getAuthErrorMessage(error));
        }
      });
    }
  </script>
</body>
</html>
