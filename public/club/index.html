<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toastmasters Club</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #f5f5f5;
        min-height: 100vh;
        font-family: 'Inter Variable', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        position: relative;
      }
      .content {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .inner {
        width: 100%;
        max-width: 600px;
        text-align: center;
      }
      #loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 200px;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(66, 66, 66, 0.1);
        border-top-color: #424242;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      #error {
        color: #757575;
      }
      .error-icon {
        font-size: 72px;
        margin-bottom: 16px;
        line-height: 1;
        display: block;
      }
      .error-title {
        font-size: 20px;
        font-weight: 600;
        color: #212121;
        margin-bottom: 8px;
        line-height: 1.4;
      }
      .error-message {
        font-size: 16px;
        color: #757575;
        line-height: 1.6;
      }
      #content {
        text-align: center;
      }
      #name {
        font-size: 28px;
        font-weight: 600;
        color: rgba(0, 0, 0, 0.87);
        margin-bottom: 12px;
        line-height: 1.3;
        letter-spacing: -0.3px;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <div class="inner">
        <div id="loading">
          <div class="spinner"></div>
        </div>
        <div id="error" style="display:none">
          <div class="error-icon">👻</div>
          <div class="error-title">Oops! Nothing lives here...</div>
          <div class="error-message" id="errorMessage"></div>
        </div>
        <div id="content" style="display:none">
          <h1 id="name"></h1>
        </div>
      </div>
    </div>
    <script type="module" src="/js/shared/firebase-init.js"></script>
    <script type="module" src="/js/pages/club.js"></script>
  </body>
</html>
