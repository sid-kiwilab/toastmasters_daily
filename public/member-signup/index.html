<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Sign Up - Toastmasters Daily</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png"/>
  
  <style>
    @font-face {
      font-family: 'GoogleSans';
      src: url('../assets/GoogleSans.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'GoogleSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #ffffff;
      color: #212121;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .signup-container {
      width: 100%;
      max-width: 420px;
    }
    
    .close-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      background: none;
      border: none;
      font-size: 28px;
      color: #6B7280;
      cursor: pointer;
      line-height: 1;
      padding: 8px;
    }
    
    .close-btn:hover {
      color: #212121;
    }
    
    .title {
      font-size: 36px;
      font-weight: 900;
      color: #212121;
      letter-spacing: -1px;
      margin-bottom: 8px;
      line-height: 1.1;
    }
    
    .subtitle {
      font-size: 16px;
      color: #6B7280;
      margin-bottom: 40px;
      font-weight: 400;
    }
    
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }
    
    input {
      width: 100%;
      padding: 16px 20px;
      border: none;
      border-radius: 12px;
      background: #F2F1F0;
      font-size: 16px;
      font-family: 'GoogleSans', sans-serif;
      color: #212121;
    }
    
    input[type="password"] {
      padding-right: 50px;
    }
    
    .password-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #6B7280;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
    }
    
    .password-toggle:hover {
      color: #212121;
    }
    
    .password-toggle svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
    }
    
    input:focus {
      outline: none;
      background: #E8E7E6;
    }
    
    input::placeholder {
      color: #9CA3AF;
    }
    
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      font-family: 'GoogleSans', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #004165 0%, #0066A3 100%);
      color: white;
      margin-bottom: 0;
    }
    
    .btn-primary:hover {
      background: linear-gradient(135deg, #003049 0%, #005588 100%);
    }
    
    .btn-google {
      background: white;
      color: #212121;
      border: 1px solid #E5E7EB;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    
    .btn-google:hover {
      background: #F9FAFB;
    }
    
    .btn-google svg {
      width: 20px;
      height: 20px;
    }
    
    .login-link {
      text-align: center;
      padding: 20px;
      background: #F9FAFB;
      border-radius: 12px;
      font-size: 15px;
      color: #6B7280;
    }
    
    .login-link a {
      color: #004165;
      text-decoration: none;
      font-weight: 600;
    }
    
    .login-link a:hover {
      text-decoration: underline;
    }
    
    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: #9CA3AF;
      font-size: 14px;
    }
    
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #E5E7EB;
    }
    
    .divider span {
      padding: 0 16px;
    }
  </style>
</head>
<body>
  <button class="close-btn" onclick="window.location.href='/'">×</button>
  
  <div class="signup-container">
    <h1 class="title">Member Sign Up</h1>
    <p class="subtitle">Create an account to upload and get feedback on your speeches</p>
    
    <form id="signup-form">
      <div class="form-group">
        <input type="email" id="email" placeholder="Email" required>
      </div>
      
      <div class="form-group">
        <input type="password" id="password" placeholder="Password" required>
        <button type="button" class="password-toggle" id="togglePassword">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      
      <div class="form-group">
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
        <button type="button" class="password-toggle" id="toggleConfirmPassword">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      
      <button type="submit" class="btn btn-primary">Create Account</button>
      
      <div class="divider">
        <span>or</span>
      </div>
      
      <button type="button" class="btn btn-google">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>
      
      <div class="login-link">
        Already have an account? <a href="../member-login/">Sign In</a>
      </div>
    </form>
  </div>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/auth-utils.js"></script>
  
  <script>
    // Initialize Firebase
    const memberAuth = initMemberAuth();
    
    // Check if user is already logged in, redirect to member base
    if (memberAuth) {
      memberAuth.onAuthStateChanged((user) => {
        if (user) {
          window.location.href = '../member-base/';
        }
      });
    }
    
    // Use notification system for errors
    function showError(message) {
      notifications.error(message);
    }
    
    function hideError() {
      // Not needed with notification system, but kept for compatibility
    }
    
    // Get form elements (declare once, reuse everywhere)
    const signupForm = document.getElementById('signup-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const togglePassword = document.getElementById('togglePassword');
    const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
    const submitBtn = signupForm ? signupForm.querySelector('button[type="submit"]') : null;
    
    let passwordVisible = false;
    
    // Password toggle functionality - toggles both password fields together
    function updatePasswordVisibility(isVisible) {
      // Update both password fields
      if (passwordInput) {
        passwordInput.type = isVisible ? 'text' : 'password';
      }
      if (confirmPasswordInput) {
        confirmPasswordInput.type = isVisible ? 'text' : 'password';
      }
      
      // Update both toggle icons
      const passwordSvg = togglePassword ? togglePassword.querySelector('svg') : null;
      const confirmSvg = toggleConfirmPassword ? toggleConfirmPassword.querySelector('svg') : null;
      
      const svgContent = isVisible 
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      
      if (passwordSvg) {
        passwordSvg.innerHTML = svgContent;
      }
      if (confirmSvg) {
        confirmSvg.innerHTML = svgContent;
      }
    }
    
    // Both toggle buttons toggle both password fields
    if (togglePassword) {
      togglePassword.addEventListener('click', () => {
        passwordVisible = !passwordVisible;
        updatePasswordVisibility(passwordVisible);
      });
    }
    
    if (toggleConfirmPassword) {
      toggleConfirmPassword.addEventListener('click', () => {
        passwordVisible = !passwordVisible;
        updatePasswordVisibility(passwordVisible);
      });
    }
    
    if (signupForm && memberAuth) {
      signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError();
        
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        
        // Validation
        if (!email || !password || !confirmPassword) {
          showError('Please fill in all fields.');
          return;
        }
        
        if (password !== confirmPassword) {
          showError('Passwords do not match.');
          return;
        }
        
        if (password.length < 6) {
          showError('Password must be at least 6 characters long.');
          return;
        }
        
        try {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Creating account...';
          
          await memberAuth.createUserWithEmailAndPassword(email, password);
          
          submitBtn.textContent = 'Success! Redirecting...';
          notifications.success('Account created successfully!');
          setTimeout(() => {
            window.location.href = '../member-base/';
          }, 800);
          
        } catch (error) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
          showError(getAuthErrorMessage(error));
        }
      });
    }
    
    // Google Sign-Up handler
    const googleSignUpBtn = document.querySelector('.btn-google');
    if (googleSignUpBtn && memberAuth) {
      const originalButtonContent = googleSignUpBtn.innerHTML;
      
      googleSignUpBtn.addEventListener('click', async () => {
        try {
          hideError();
          googleSignUpBtn.disabled = true;
          googleSignUpBtn.innerHTML = '<span>Signing up...</span>';
          
          const provider = createGoogleProvider();
          const result = await memberAuth.signInWithPopup(provider);
          
          googleSignUpBtn.innerHTML = '<span>Success! Redirecting...</span>';
          notifications.success('Account created with Google!');
          setTimeout(() => {
            window.location.href = '../member-base/';
          }, 800);
          
        } catch (error) {
          googleSignUpBtn.disabled = false;
          googleSignUpBtn.innerHTML = originalButtonContent;
          showError(getAuthErrorMessage(error));
        }
      });
    }
  </script>
</body>
</html>
