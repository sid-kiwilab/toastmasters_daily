<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - Toastmasters Daily</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png"/>
  
  <style>
    @font-face {
      font-family: 'GoogleSans';
      src: url('../assets/GoogleSans.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'GoogleSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #ffffff;
      color: #1a1f3a;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .container {
      text-align: center;
      padding: 40px 20px;
      max-width: 500px;
    }
    
    .success-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: #d1fae5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .success-icon svg {
      width: 48px;
      height: 48px;
      color: #065f46;
    }
    
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #060607;
      margin-bottom: 12px;
    }
    
    p {
      font-size: 16px;
      color: #4f5660;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    
    .redirect-info {
      font-size: 14px;
      color: #64748b;
      margin-top: 24px;
    }
    
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: #004165;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      transition: background 0.2s ease;
    }
    
    .btn:hover {
      background: #003049;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="success-icon">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
      </svg>
    </div>
    <h1>Payment Successful!</h1>
    <p>Your subscription has been activated successfully. You will be redirected to your subscription page shortly.</p>
    <a href="/club-base/subscription/" class="btn">Go to Subscription</a>
    <p class="redirect-info">Redirecting automatically in <span id="countdown">5</span> seconds...</p>
  </div>
  
  <script>
    let countdown = 5;
    const countdownElement = document.getElementById('countdown');
    
    const timer = setInterval(() => {
      countdown--;
      if (countdownElement) {
        countdownElement.textContent = countdown;
      }
      if (countdown <= 0) {
        clearInterval(timer);
        window.location.href = '/club-base/subscription/';
      }
    }, 1000);
  </script>
</body>
</html>
