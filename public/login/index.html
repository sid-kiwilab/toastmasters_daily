<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Toastmasters Daily</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="preload" href="/assets/InterVariable.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <script src="/js/version.js"></script>
    <script>
      // Load CSS with version (fonts first for immediate loading)
      document.write('<link rel="stylesheet" href="/css/fonts.css?v=' + APP_VERSION + '">');
      document.write('<link rel="stylesheet" href="/css/styles.css?v=' + APP_VERSION + '">');
      document.write('<link rel="stylesheet" href="/css/notification.css?v=' + APP_VERSION + '">');
      document.write('<link rel="stylesheet" href="/css/login.css?v=' + APP_VERSION + '">');
    </script>
  </head>
  <body>
    <div class="login-wrapper">
      <div class="login-container">
        <h1>Login</h1>
        <p class="login-subtitle">Sign in to create meetings</p>

        <form id="loginForm" class="login-form">
          <div class="form-group">
            <input
              type="email"
              id="emailInput"
              class="form-input"
              placeholder="Email"
              required
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <input
              type="password"
              id="passwordInput"
              class="form-input"
              placeholder="Password"
              required
              autocomplete="current-password"
            />
          </div>

          <button type="submit" class="join-button" id="loginSubmitButton">
            <span id="loginButtonText">Login</span>
          </button>
        </form>

        <div class="login-footer">
          <a href="/" class="back-link">← Back to home</a>
        </div>
      </div>
    </div>

    <script>
      // Load JS with version
      const script1 = document.createElement('script');
      script1.src = '/js/notification.js?v=' + APP_VERSION;
      document.body.appendChild(script1);
      
      const script2 = document.createElement('script');
      script2.src = '/js/firebase-config.js?v=' + APP_VERSION;
      document.body.appendChild(script2);
      
      const script3 = document.createElement('script');
      script3.src = '/js/login.js?v=' + APP_VERSION;
      document.body.appendChild(script3);
    </script>
  </body>
</html>
