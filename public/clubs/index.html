<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Club - Toastmasters Daily</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png"/>
  
  <link rel="preload" href="../assets/GoogleSans.woff2" as="font" type="font/woff2" crossorigin="anonymous">
  
  <style>
    @font-face {
      font-family: 'GoogleSans';
      src: url('../assets/GoogleSans.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'GoogleSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #ffffff;
      color: #1a1f3a;
    }
    
    .header {
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    
    .logo img {
      height: 32px;
      width: auto;
    }
    
    .logo-text {
      font-size: 24px;
      font-weight: 600;
      color: #1a1f3a;
    }
    
    .main-content {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    
    .club-header {
      text-align: center;
      margin-bottom: 48px;
    }
    
    .club-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
    }
    
    .club-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .club-name {
      font-size: 32px;
      font-weight: 700;
      color: #212121;
      margin-bottom: 12px;
    }
    
    .club-location {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 16px;
      color: #757575;
      margin-bottom: 16px;
    }
    
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
    }
    
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #f0f0f0;
      border-top-color: #004165;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      text-align: center;
      padding: 40px 24px;
    }
    
    .error-title {
      font-size: 24px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }
    
    .error-message {
      font-size: 16px;
      color: #6b7280;
      margin-bottom: 24px;
    }
    
    .back-button {
      padding: 12px 24px;
      background: #004165;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    
    .back-button:hover {
      background: #003049;
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="/" class="logo">
      <img src="../assets/logo.png" alt="Toastmasters Daily">
      <span class="logo-text">Toastmasters Daily</span>
    </a>
  </header>
  
  <main class="main-content">
    <div id="loading-state" class="loading-container">
      <div class="loading-spinner"></div>
    </div>
    
    <div id="error-state" class="error-container" style="display: none;">
      <div class="error-title">Oops! Nothing lives here...</div>
      <div class="error-message" id="error-message">Club not found</div>
      <a href="/" class="back-button">Back to Home</a>
    </div>
    
    <div id="club-content" style="display: none;">
      <div class="club-header">
        <div class="club-logo">
          <img src="../assets/logo.png" alt="Toastmasters Daily">
        </div>
        <h1 class="club-name" id="club-name"></h1>
        <div class="club-location" id="club-location" style="display: none;">
          <span id="club-location-text"></span>
        </div>
      </div>
    </div>
  </main>
  
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth-utils.js"></script>
  
  <script>
    // Extract club code from URL pathname
    function getClubCodeFromUrl() {
      const pathname = window.location.pathname;
      // Extract club code from /clubs/{club_code}
      const match = pathname.match(/\/clubs\/([^\/]+)/);
      return match ? match[1] : null;
    }
    
    // Initialize Firebase
    let clubDb = null;
    
    function showError(message) {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('error-state').style.display = 'flex';
      document.getElementById('error-message').textContent = message;
    }
    
    function showClubContent() {
      document.getElementById('loading-state').style.display = 'none';
      document.getElementById('club-content').style.display = 'block';
    }
    
    async function loadClubData() {
      const clubCode = getClubCodeFromUrl();
      
      if (!clubCode) {
        showError('Invalid club code');
        return;
      }
      
      if (!clubDb) {
        showError('Database not initialized');
        return;
      }
      
      try {
        // Query club_codes collection
        const clubCodeDoc = await clubDb.collection('club_codes').doc(clubCode).get();
        
        if (!clubCodeDoc.exists) {
          showError('Club not found');
          return;
        }
        
        const uid = clubCodeDoc.data()?.uid;
        if (!uid) {
          showError('Invalid club data');
          return;
        }
        
        // Query users collection
        const userDoc = await clubDb.collection('users').doc(uid).get();
        
        if (!userDoc.exists) {
          showError('Club owner information not available');
          return;
        }
        
        const userData = userDoc.data();
        document.getElementById('club-name').textContent = userData?.club_name || 'Unnamed Club';
        
        if (userData?.club_location) {
          document.getElementById('club-location').style.display = 'flex';
          document.getElementById('club-location-text').textContent = userData.club_location;
        }
        
        showClubContent();
      } catch (error) {
        console.error('Error loading club data:', error);
        showError('Error loading club: ' + error.message);
      }
    }
    
    // Initialize
    function init() {
      try {
        initClubAuth();
        const clubApp = firebase.app('club');
        clubDb = firebase.firestore(clubApp);
        loadClubData();
      } catch (error) {
        console.error('Error initializing:', error);
        showError('Error initializing: ' + error.message);
      }
    }
    
    // Wait for scripts to load
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      setTimeout(init, 100);
    }
  </script>
</body>
</html>
