<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toastmasters Daily</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="stylesheet" href="/css/fonts.css">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        background: #f5f5f5;
        min-height: 100vh;
      }
      
      .top-banner {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: transparent;
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        z-index: 100;
      }
      
      .banner-message {
        font-size: 15px;
        color: #212121;
        font-weight: 500;
      }
      
      .login-button {
        background-color: #424242;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        font-family: inherit;
      }
      
      .login-button:hover {
        background-color: #616161;
      }
    </style>
  </head>
  <body>
    <div class="top-banner">
      <span class="banner-message">Create a meeting?</span>
      <button class="login-button" id="loginButton">Login</button>
    </div>

    <script type="module" src="/js/shared/firebase-init.js"></script>
  </body>
</html>
