<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toastmasters Daily</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/notification.css">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        background: #f5f5f5;
        min-height: 100vh;
      }
      
      .top-banner {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: transparent;
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        z-index: 100;
      }
      
      .banner-message {
        font-size: 15px;
        color: #212121;
        font-weight: 500;
      }
      
      .login-button {
        background-color: #424242;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        font-family: inherit;
      }
      
      .login-button:hover {
        background-color: #616161;
      }
    </style>
  </head>
  <body>
    <div class="top-banner">
      <span class="banner-message">Create a meeting?</span>
      <button class="login-button" id="loginButton">Login</button>
    </div>

    <!-- Login Overlay -->
    <div class="login-overlay" id="loginOverlay">
      <div class="login-overlay-content">
        <button class="login-close-button" id="closeLoginOverlay">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 5L5 15M5 5l10 10"/>
          </svg>
        </button>
        
        <!-- Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Login</button>
          <button class="auth-tab" data-tab="signup">Sign Up</button>
          <button class="auth-tab" data-tab="reset">Reset Password</button>
        </div>

        <!-- Login Tab -->
        <div class="auth-tab-content active" id="loginTab">
          <h2>Login</h2>
          <p class="login-overlay-subtitle">Sign in to create meetings</p>
          
          <form id="loginOverlayForm" class="login-overlay-form">
            <div class="form-group">
              <input
                type="email"
                id="loginEmailInput"
                class="form-input"
                placeholder="Email"
                required
                autocomplete="email"
              />
            </div>

            <div class="form-group password-group">
              <input
                type="password"
                id="loginPasswordInput"
                class="form-input"
                placeholder="Password"
                required
                autocomplete="current-password"
              />
              <button type="button" class="password-toggle" id="loginPasswordToggle">
                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>

            <button type="submit" class="join-button" id="loginSubmitButton">
              <span id="loginButtonText">Login</span>
            </button>
          </form>
        </div>

        <!-- Sign Up Tab -->
        <div class="auth-tab-content" id="signupTab">
          <h2>Sign Up</h2>
          <p class="login-overlay-subtitle">Create a new account</p>
          
          <form id="signupOverlayForm" class="login-overlay-form">
            <div class="form-group">
              <input
                type="email"
                id="signupEmailInput"
                class="form-input"
                placeholder="Email"
                required
                autocomplete="email"
              />
            </div>

            <div class="form-group password-group">
              <input
                type="password"
                id="signupPasswordInput"
                class="form-input"
                placeholder="Password"
                required
                autocomplete="new-password"
              />
              <button type="button" class="password-toggle" id="signupPasswordToggle">
                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>

            <div class="form-group password-group">
              <input
                type="password"
                id="signupConfirmPasswordInput"
                class="form-input"
                placeholder="Confirm Password"
                required
                autocomplete="new-password"
              />
              <button type="button" class="password-toggle" id="signupConfirmPasswordToggle">
                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>

            <button type="submit" class="join-button" id="signupSubmitButton">
              <span id="signupButtonText">Sign Up</span>
            </button>
          </form>
        </div>

        <!-- Reset Password Tab -->
        <div class="auth-tab-content" id="resetTab">
          <h2>Reset Password</h2>
          <p class="login-overlay-subtitle">Enter your email to reset your password</p>
          
          <form id="resetOverlayForm" class="login-overlay-form">
            <div class="form-group">
              <input
                type="email"
                id="resetEmailInput"
                class="form-input"
                placeholder="Email"
                required
                autocomplete="email"
              />
            </div>

            <button type="submit" class="join-button" id="resetSubmitButton">
              <span id="resetButtonText">Send Link</span>
            </button>
          </form>
        </div>
      </div>
    </div>

    <script src="/js/shared/notification.js"></script>
    <script type="module" src="/js/shared/firebase-init.js"></script>
    <script type="module" src="/js/shared/auth.js"></script>
    <script>
      // Function to clear all form fields
      function clearAllForms() {
        // Clear login form
        const loginEmail = document.getElementById('loginEmailInput');
        const loginPassword = document.getElementById('loginPasswordInput');
        if (loginEmail) loginEmail.value = '';
        if (loginPassword) {
          loginPassword.value = '';
          loginPassword.type = 'password';
          const loginEyeIcon = document.querySelector('#loginPasswordToggle .eye-icon');
          const loginEyeOffIcon = document.querySelector('#loginPasswordToggle .eye-off-icon');
          if (loginEyeIcon) loginEyeIcon.style.display = 'block';
          if (loginEyeOffIcon) loginEyeOffIcon.style.display = 'none';
        }

        // Clear signup form
        const signupEmail = document.getElementById('signupEmailInput');
        const signupPassword = document.getElementById('signupPasswordInput');
        const signupConfirmPassword = document.getElementById('signupConfirmPasswordInput');
        if (signupEmail) signupEmail.value = '';
        if (signupPassword) {
          signupPassword.value = '';
          signupPassword.type = 'password';
          const signupEyeIcon = document.querySelector('#signupPasswordToggle .eye-icon');
          const signupEyeOffIcon = document.querySelector('#signupPasswordToggle .eye-off-icon');
          if (signupEyeIcon) signupEyeIcon.style.display = 'block';
          if (signupEyeOffIcon) signupEyeOffIcon.style.display = 'none';
        }
        if (signupConfirmPassword) {
          signupConfirmPassword.value = '';
          signupConfirmPassword.type = 'password';
          const confirmEyeIcon = document.querySelector('#signupConfirmPasswordToggle .eye-icon');
          const confirmEyeOffIcon = document.querySelector('#signupConfirmPasswordToggle .eye-off-icon');
          if (confirmEyeIcon) confirmEyeIcon.style.display = 'block';
          if (confirmEyeOffIcon) confirmEyeOffIcon.style.display = 'none';
        }

        // Clear reset password form
        const resetEmail = document.getElementById('resetEmailInput');
        if (resetEmail) resetEmail.value = '';
      }

      // Function to close overlay and clear forms
      async function closeLoginOverlayAndClear() {
        if (loginOverlay) {
          loginOverlay.classList.remove('show');
          clearAllForms();
        }
      }

      // Update banner based on authentication status
      function updateBannerForAuthStatus() {
        if (!window.auth) return;
        
        const bannerMessage = document.querySelector('.banner-message');
        const loginButton = document.getElementById('loginButton');
        
        window.auth.onAuthStateChanged((user) => {
          if (user) {
            if (bannerMessage) {
              bannerMessage.textContent = 'You are logged in';
            }
            if (loginButton) {
              loginButton.textContent = 'Go to Base';
            }
          } else {
            if (bannerMessage) {
              bannerMessage.textContent = 'Create a meeting?';
            }
            if (loginButton) {
              loginButton.textContent = 'Login';
            }
          }
        });
      }

      // Show login overlay or navigate to base
      const loginButton = document.getElementById('loginButton');
      const loginOverlay = document.getElementById('loginOverlay');
      const closeLoginOverlay = document.getElementById('closeLoginOverlay');

      if (loginButton && loginOverlay) {
        loginButton.addEventListener('click', function() {
          // If button says "Go to Base", navigate to base
          if (this.textContent === 'Go to Base') {
            window.location.href = '/base/';
            return;
          }
          // Otherwise show login overlay
          loginOverlay.classList.add('show');
        });
      }

      // Initialize banner update when auth is available
      function initBannerUpdate() {
        if (window.auth) {
          updateBannerForAuthStatus();
        } else {
          setTimeout(initBannerUpdate, 100);
        }
      }
      initBannerUpdate();

      // Close login overlay
      if (closeLoginOverlay && loginOverlay) {
        closeLoginOverlay.addEventListener('click', closeLoginOverlayAndClear);
      }

      // Close overlay on escape key
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && loginOverlay && loginOverlay.classList.contains('show')) {
          closeLoginOverlayAndClear();
        }
      });

      // Auth tabs
      const authTabs = document.querySelectorAll('.auth-tab');
      const authTabContents = document.querySelectorAll('.auth-tab-content');

      authTabs.forEach(tab => {
        tab.addEventListener('click', function() {
          const targetTab = this.getAttribute('data-tab');
          
          // Update active tab
          authTabs.forEach(t => t.classList.remove('active'));
          this.classList.add('active');
          
          // Update active content
          authTabContents.forEach(content => {
            content.classList.remove('active');
            if (content.id === `${targetTab}Tab`) {
              content.classList.add('active');
            }
          });
        });
      });

      // Password toggle functionality
      function setupPasswordToggle(toggleId, inputId) {
        const toggle = document.getElementById(toggleId);
        const input = document.getElementById(inputId);
        
        if (toggle && input) {
          toggle.addEventListener('click', function() {
            const eyeIcon = this.querySelector('.eye-icon');
            const eyeOffIcon = this.querySelector('.eye-off-icon');
            
            if (input.type === 'password') {
              input.type = 'text';
              if (eyeIcon) eyeIcon.style.display = 'none';
              if (eyeOffIcon) eyeOffIcon.style.display = 'block';
            } else {
              input.type = 'password';
              if (eyeIcon) eyeIcon.style.display = 'block';
              if (eyeOffIcon) eyeOffIcon.style.display = 'none';
            }
          });
        }
      }

      setupPasswordToggle('loginPasswordToggle', 'loginPasswordInput');
      setupPasswordToggle('signupPasswordToggle', 'signupPasswordInput');
      setupPasswordToggle('signupConfirmPasswordToggle', 'signupConfirmPasswordInput');

      // Helper function to show loading state
      function setButtonLoading(button, buttonText, isLoading) {
        if (isLoading) {
          button.disabled = true;
          buttonText.innerHTML = '<span class="spinner"></span>';
        } else {
          button.disabled = false;
          // Restore original text based on button ID
          if (button.id === 'loginSubmitButton') {
            buttonText.textContent = 'Login';
          } else if (button.id === 'signupSubmitButton') {
            buttonText.textContent = 'Sign Up';
          } else if (button.id === 'resetSubmitButton') {
            buttonText.textContent = 'Send Link';
          }
        }
      }

      // Wait for auth to be available
      function waitForAuth(callback) {
        if (window.auth && window.handleLogin) {
          callback();
        } else {
          setTimeout(() => waitForAuth(callback), 100);
        }
      }

      // Login form submission
      const loginForm = document.getElementById('loginOverlayForm');
      if (loginForm) {
        loginForm.addEventListener('submit', async function(e) {
          e.preventDefault();
          
          const email = document.getElementById('loginEmailInput')?.value;
          const password = document.getElementById('loginPasswordInput')?.value;
          const submitButton = document.getElementById('loginSubmitButton');
          const buttonText = document.getElementById('loginButtonText');
          
          if (!email || !password) {
            showNotification('Please fill in all fields', 'error');
            return;
          }
          
          waitForAuth(async () => {
            setButtonLoading(submitButton, buttonText, true);
            
            const result = await window.handleLogin(email, password);
            
            setButtonLoading(submitButton, buttonText, false);
            
            if (result.success) {
              showNotification('Login successful!', 'success');
              // Wait a bit to show notification, then navigate to base
              setTimeout(() => {
                closeLoginOverlayAndClear();
                window.location.href = '/base/';
              }, 1500);
            } else {
              showNotification(result.error || 'Login failed. Please try again.', 'error');
            }
          });
        });
      }

      // Signup form submission
      const signupForm = document.getElementById('signupOverlayForm');
      if (signupForm) {
        signupForm.addEventListener('submit', async function(e) {
          e.preventDefault();
          
          const email = document.getElementById('signupEmailInput')?.value;
          const password = document.getElementById('signupPasswordInput')?.value;
          const confirmPassword = document.getElementById('signupConfirmPasswordInput')?.value;
          const submitButton = document.getElementById('signupSubmitButton');
          const buttonText = document.getElementById('signupButtonText');
          
          if (!email || !password || !confirmPassword) {
            showNotification('Please fill in all fields', 'error');
            return;
          }
          
          if (password !== confirmPassword) {
            showNotification('Passwords do not match', 'error');
            return;
          }
          
          if (password.length < 6) {
            showNotification('Password must be at least 6 characters', 'error');
            return;
          }
          
          waitForAuth(async () => {
            setButtonLoading(submitButton, buttonText, true);
            
            const result = await window.handleSignUp(email, password);
            
            setButtonLoading(submitButton, buttonText, false);
            
            if (result.success) {
              showNotification('Account created successfully! Please check your email to verify your account.', 'success');
              // Wait a bit to show notification, then navigate to base
              setTimeout(() => {
                closeLoginOverlayAndClear();
                window.location.href = '/base/';
              }, 1500);
            } else {
              showNotification(result.error || 'Sign up failed. Please try again.', 'error');
            }
          });
        });
      }

      // Reset password form submission
      const resetForm = document.getElementById('resetOverlayForm');
      if (resetForm) {
        resetForm.addEventListener('submit', async function(e) {
          e.preventDefault();
          
          const email = document.getElementById('resetEmailInput')?.value;
          const submitButton = document.getElementById('resetSubmitButton');
          const buttonText = document.getElementById('resetButtonText');
          
          if (!email) {
            showNotification('Please enter your email', 'error');
            return;
          }
          
          waitForAuth(async () => {
            setButtonLoading(submitButton, buttonText, true);
            
            const result = await window.handleResetPassword(email);
            
            setButtonLoading(submitButton, buttonText, false);
            
            if (result.success) {
              showNotification('Password reset email sent! Please check your inbox.', 'success');
            } else {
              showNotification(result.error || 'Failed to send reset email. Please try again.', 'error');
            }
          });
        });
      }
    </script>
  </body>
</html>
