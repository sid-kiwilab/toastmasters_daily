<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toastmasters Daily</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="preload" href="/assets/InterVariable.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <script src="/js/version.js"></script>
    <script>
      // Load CSS with version (fonts first for immediate loading)
      document.write('<link rel="stylesheet" href="/css/fonts.css?v=' + APP_VERSION + '">');
      document.write('<link rel="stylesheet" href="/css/styles.css?v=' + APP_VERSION + '">');
      document.write('<link rel="stylesheet" href="/css/notification.css?v=' + APP_VERSION + '">');
    </script>
  </head>
  <body>
    <div class="top-banner">
      <span class="banner-message">Want to create a meeting?</span>
      <button class="join-button" id="loginButton">Login</button>
    </div>
    <div class="content-wrapper">
      <h1>Enter the code to join</h1>
      <p class="subtitle">Best speeches coming your way!</p>

      <div class="code-input-container">
        <input
          type="text"
          id="codeInput"
          class="code-input"
          placeholder="1234 5678"
          maxlength="9"
          autocomplete="off"
        />
      </div>

      <button class="join-button" id="joinButton">
        <span id="joinButtonText">Join</span>
      </button>
    </div>

    <!-- Login Overlay -->
    <div class="login-overlay" id="loginOverlay">
      <div class="login-overlay-content">
        <button class="login-close-button" id="closeLoginOverlay">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 5L5 15M5 5l10 10"/>
          </svg>
        </button>
        
        <!-- Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Login</button>
          <button class="auth-tab" data-tab="signup">Sign Up</button>
          <button class="auth-tab" data-tab="reset">Reset Password</button>
        </div>

        <!-- Login Tab -->
        <div class="auth-tab-content active" id="loginTab">
          <h2>Login</h2>
          <p class="login-overlay-subtitle">Sign in to create meetings</p>
          
          <form id="loginOverlayForm" class="login-overlay-form">
            <div class="form-group">
              <input
                type="email"
                id="loginEmailInput"
                class="form-input"
                placeholder="Email"
                required
                autocomplete="email"
              />
            </div>

            <div class="form-group password-group">
              <input
                type="password"
                id="loginPasswordInput"
                class="form-input"
                placeholder="Password"
                required
                autocomplete="current-password"
              />
              <button type="button" class="password-toggle" id="loginPasswordToggle">
                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>

            <button type="submit" class="join-button" id="loginSubmitButton">
              <span id="loginButtonText">Login</span>
            </button>
          </form>
        </div>

        <!-- Sign Up Tab -->
        <div class="auth-tab-content" id="signupTab">
          <h2>Sign Up</h2>
          <p class="login-overlay-subtitle">Create a new account</p>
          
          <form id="signupOverlayForm" class="login-overlay-form">
            <div class="form-group">
              <input
                type="email"
                id="signupEmailInput"
                class="form-input"
                placeholder="Email"
                required
                autocomplete="email"
              />
            </div>

            <div class="form-group password-group">
              <input
                type="password"
                id="signupPasswordInput"
                class="form-input"
                placeholder="Password"
                required
                autocomplete="new-password"
              />
              <button type="button" class="password-toggle" id="signupPasswordToggle">
                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>

            <div class="form-group password-group">
              <input
                type="password"
                id="signupConfirmPasswordInput"
                class="form-input"
                placeholder="Confirm Password"
                required
                autocomplete="new-password"
              />
              <button type="button" class="password-toggle" id="signupConfirmPasswordToggle">
                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>

            <button type="submit" class="join-button" id="signupSubmitButton">
              <span id="signupButtonText">Sign Up</span>
            </button>
          </form>
        </div>

        <!-- Reset Password Tab -->
        <div class="auth-tab-content" id="resetTab">
          <h2>Reset Password</h2>
          <p class="login-overlay-subtitle">Enter your email to reset your password</p>
          
          <form id="resetOverlayForm" class="login-overlay-form">
            <div class="form-group">
              <input
                type="email"
                id="resetEmailInput"
                class="form-input"
                placeholder="Email"
                required
                autocomplete="email"
              />
            </div>

            <button type="submit" class="join-button" id="resetSubmitButton">
              <span id="resetButtonText">Send Link</span>
            </button>
          </form>
        </div>
      </div>
    </div>

    <script>
      // Load JS with version - sequential loading to ensure order
      const script1 = document.createElement('script');
      script1.src = '/js/notification.js?v=' + APP_VERSION;
      script1.onload = function() {
        const script2 = document.createElement('script');
        script2.src = '/js/firebase-config.js?v=' + APP_VERSION;
        script2.onload = function() {
          const script3 = document.createElement('script');
          script3.src = '/js/auth.js?v=' + APP_VERSION;
          script3.onload = function() {
            // auth.js is loaded, now load main.js
            const script4 = document.createElement('script');
            script4.src = '/js/main.js?v=' + APP_VERSION;
            document.body.appendChild(script4);
          };
          document.body.appendChild(script3);
        };
        document.body.appendChild(script2);
      };
      document.body.appendChild(script1);
    </script>
  </body>
</html>
